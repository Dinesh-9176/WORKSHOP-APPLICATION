version: '3.8'

services:
  # ── Postgres ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-ignit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ignit_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-ignit_workshop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ignit} -d ${POSTGRES_DB:-ignit_workshop}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Next.js app ──────────────────────────────────────────────────────────────
  web:
    build:
      context:    .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port NOT exposed to host — Caddy talks to it over internal Docker network
    expose:
      - '3000'
    environment:
      DATABASE_URL:         postgresql://${POSTGRES_USER:-ignit}:${POSTGRES_PASSWORD:-ignit_pass}@db:5432/${POSTGRES_DB:-ignit_workshop}
      ADMIN_EMAIL:          ${ADMIN_EMAIL:-admin@ignit.in}
      ADMIN_PASSWORD:       ${ADMIN_PASSWORD:-changeme123}
      JWT_SECRET:           ${JWT_SECRET:-change-this-to-a-long-random-secret-min-32-chars}
      NEXT_PUBLIC_BASE_URL: https://${DOMAIN:-localhost}
      UPLOAD_DIR:           /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── Caddy reverse proxy + automatic HTTPS ───────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'   # HTTP/3
    environment:
      DOMAIN:     ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@ignit.in}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
